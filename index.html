<!doctype html>
<html lang="en" class="dark">

    <meta name="description" content="Enterprise Multi-Hospital HRMS with AI Shift Roster, Credential Management, Payroll, Recruitment, LMS & Employee Portal" />

    <meta property="og:description" content="Enterprise Multi-Hospital HRMS with AI Shift Roster, Credential Management, Payroll, Recruitment, LMS & Employee Portal" />
    
    <!-- PWA & Apple iOS Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />

    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.svg" />

  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {

            console.log('SW registration note:', err);
          });
        });
      }
    </script>
